<!doctype html><html lang="ko"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'nonce-selection'; object-src 'none'">
<title>검색과 이름 경계</title><style>body{font:15px system-ui;margin:24px}section{margin:18px 0;border:1px solid #ccc;padding:12px}.hidden{display:none}.offscreen{position:absolute;top:3500px}output{display:block}iframe{width:700px;height:240px}</style>
<h1>검색과 이름 경계</h1><output id="click-count">0</output><output id="events">[]</output><output id="verdict">준비</output><output id="fill-verdict">준비</output>
<section id="css"><button class="same" id="css-main" data-record>Main CSS</button><div id="scope-host"></div><button id="add">Add CSS target</button></section>
<section id="roles"><button id="role-a" data-record>A</button><button id="empty-name" data-record></button><div role="link" aria-label="A" id="link-a">Link body</div><div role="button" tabindex="0" id="explicit-role" data-record>Explicit</div><div role="unknown-role button" id="fallback-role" data-record>Fallback Explicit</div><h5>Fifth Heading</h5><button hidden id="hidden-role">Hidden Role</button><button class="offscreen" id="offscreen-role">Offscreen Role</button><button data-record>Save Duplicate</button><button data-record>Save Duplicate</button><button>같은 😀</button><button>같은 😀</button><div role="region" id="unnamed-region"><button>Region Child</button></div><img alt="Picture" title="Wrong picture title" width="10" height="10" id="picture"><input type="image" alt="Image Submit" title="Wrong image title" id="image-submit"></section>
<section id="names"><span id="ref-beta">Beta</span><span id="ref-alpha">Alpha</span><label for="priority">Native</label><input id="priority" value="initial" aria-label="ARIA" aria-labelledby="ref-beta ref-alpha ref-beta missing"><input id="partial" aria-labelledby="missing ref-beta" aria-label="Partial Wrong"><input id="broken" aria-labelledby="missing" aria-label="Fallback ARIA"><span id="empty-ref"> </span><input id="empty-fallback" aria-labelledby="empty-ref" aria-label="After Empty"><span id="hidden-ref" class="hidden" aria-hidden="true">Hidden Explicit</span><input id="hidden-name" aria-labelledby="hidden-ref"><input id="self-cycle" aria-labelledby="self-cycle ref-alpha"><span id="loop-a" aria-labelledby="loop-b"></span><span id="loop-b" aria-labelledby="loop-a"></span><input id="cycle-fallback" aria-labelledby="loop-a" aria-label="Cycle Fallback"><div id="name-shadow"></div>
<label for="multiple">First</label><input id="multiple"><label for="multiple">Second</label><label>Wrapped<input id="wrapped"></label><label id="long-label-text" for="long-label"></label><input id="long-label"><label for="slot-input"><span id="label-host"><span slot="n">Slot Name</span></span></label><input id="slot-input"><input id="placeholder" placeholder="Hint Label"><p>Plain Unconnected Label</p><label>Unconnected Label</label><input aria-label="Same Label" id="duplicate-label-a" value="initial"><input aria-label="Same Label" id="duplicate-label-b" value="initial"></section>
<section id="texts"><button id="long-body" aria-label="Accessible A" data-record></button><div id="minimum-parent"><button data-record><span id="minimum-span">Unique Confirm</span></button></div><p id="text-sibling-a">Sibling Text</p><p id="text-sibling-b">Sibling Text</p><p id="adjacent"><span>foo</span><span>bar</span></p><p id="spaced"><span>foo</span>&#32;
 <span>bar</span></p><div id="adjacent-shadow"><span slot="f">foo</span></div><p id="case-a">Case  한글&#32;
 😀</p><p id="case-b">Case 한글 😀</p><p id="aria-text" aria-hidden="true">Aria Hidden Text</p><div aria-hidden="true"><p>Nested Aria Text</p></div><p id="css-text" class="hidden">CSS Hidden Text</p><p id="offscreen-text" class="offscreen">Offscreen Text</p><template>Template Needle</template><script type="application/json">"Script Needle"</script><style>/* Style Needle */</style><noscript>Noscript Needle</noscript></section>
<section id="refs"><button id="ref-target" data-record>Stable Ref</button></section><button id="replace">Replace Ref</button><button id="remove">Remove Ref</button><button id="navigate-child">Navigate Child</button><button id="proof-button" data-record>Proof Button</button><label for="proof-field">Proof Field</label><input id="proof-field">
<script nonce="selection">
const embedded=new URLSearchParams(location.search).has('embedded');document.body.dataset.scope=embedded?'child':'main';
if(embedded)document.querySelector('#css-main').id='css-child';
document.querySelector('#scope-host').attachShadow({mode:'open'}).innerHTML='<button class="same" id="'+(embedded?'shadow-child':'shadow-main')+'" data-record>Shadow CSS</button>';
document.querySelector('#name-shadow').attachShadow({mode:'open'}).innerHTML='<span id="ref-beta">Shadow Beta</span><input id="shadow-name" aria-labelledby="ref-beta" aria-label="Wrong Shadow">';
document.querySelector('#label-host').attachShadow({mode:'open'}).innerHTML='Shadow <slot name="n"></slot>';
document.querySelector('#adjacent-shadow').attachShadow({mode:'open'}).innerHTML='<slot name="f"></slot><span>bar</span>';
document.querySelector('#long-label-text').textContent='x'.repeat(1000)+' 라벨끝🧭';document.querySelector('#long-body').textContent='v'.repeat(1000)+' 본문끝🧭';
document.querySelector('#add').onclick=()=>{const target=document.createElement('button');target.className='same';target.id='css-added';target.dataset.record='';target.textContent='Added CSS';document.querySelector('#css').append(target)};
document.querySelector('#replace').onclick=()=>{const old=document.querySelector('#ref-target');old?.replaceWith(old.cloneNode(true))};document.querySelector('#remove').onclick=()=>document.querySelector('#ref-target')?.remove();
const events=[];document.addEventListener('click',event=>{const target=event.composedPath().find(node=>node instanceof Element&&node.hasAttribute('data-record'));if(!target)return;events.push({type:'click',id:target.id,trusted:event.isTrusted});document.querySelector('#events').textContent=JSON.stringify(events);document.querySelector('#click-count').textContent=String(events.length);if(target.id==='proof-button'&&event.isTrusted)document.querySelector('#verdict').textContent='PASS: proof clicked'});
document.addEventListener('input',event=>{if(event.target.id==='proof-field'&&event.isTrusted&&event.target.value==='selection-proof')document.querySelector('#fill-verdict').textContent='PASS: proof filled'});
if(!embedded){const frame=document.createElement('iframe');frame.id='child';frame.title='Selection child';frame.src=location.protocol+'//mail.test:'+location.port+'/selection?embedded=1';document.body.append(frame);document.querySelector('#navigate-child').onclick=()=>frame.src+='&version=2'}
</script></html>
