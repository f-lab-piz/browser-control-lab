<!doctype html><html lang="ko"><meta charset="utf-8"><title>독립 리뷰 경계 회귀</title><style>body{margin:0}#long{height:50px;overflow:hidden}#top{height:600px;background:red}#bottom{height:1600px;width:2200px;background:blue}#wide{width:2400px;height:200px;background:lime}</style><label for="labelled">Only visible label</label><input id="labelled"><span id="aria-name">Only aria labelled</span><input aria-labelledby="aria-name"><div id="adjacent"><span>foo</span><span>bar</span><button>Select row</button></div><div id="spaced"><span>foo </span><span>bar</span></div><div id="nested"><span>fo<b>o</b></span><span>ba<i>r</i></span></div><div id="slot-adjacent"><span slot="first">foo</span><span slot="second">bar</span></div><div id="long"><span id="prefix"></span><span>needle</span></div><div id="slot-long"><span slot="tail" id="slot-tail"></span></div><details><summary><span id="host"></span></summary><div id="hidden-host"></div><button>Hidden content</button></details><div id="top"></div><div id="bottom"></div><div id="wide"></div><script>document.getElementById('prefix').textContent='x'.repeat(700);document.getElementById('slot-tail').textContent='x'.repeat(900)+' slotneedle';document.getElementById('slot-long').attachShadow({mode:'open'}).innerHTML='<slot name="tail"></slot>';document.getElementById('slot-adjacent').attachShadow({mode:'open'}).innerHTML='<slot name="first"></slot><slot name="second"></slot>';const host=document.getElementById('host');host.attachShadow({mode:'open'}).innerHTML='<button>Shadow summary</button>';host.shadowRoot.querySelector('button').onclick=e=>e.target.textContent='clicked';document.getElementById('hidden-host').attachShadow({mode:'open'}).innerHTML='<button>Hidden shadow content</button>';</script></html>
